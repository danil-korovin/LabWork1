name: C++ CI

on:
  push:
    branches:
      - main
      - feature-branch
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install -y g++

    - name: Build
      working-directory: LabWork1
      run: make -f Makefile

    - name: Run
      working-directory: LabWork1
      run: |
        ./main
