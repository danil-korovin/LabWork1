name: C++ CI

on:
  push:
    branches:
      - main
      - final
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y g++
        sudo apt-get install -y build-essential libgtest-dev googletest

    - name: Build
      run: make -f Makefile

    - name: Run
      run: |
        ./main

    - name: Build test
      run: make test

    - name: Run test
      run: |
        ./test
